<form id="frmPeriodo">
    <div class="card border-secondary mb-3" style="min-width: 700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Periodos


                <div class="ms-auto">
                    <button data-form="periodo" type="button" class="btn-close" aria-label="Close"></button>
                </div> 
               </div>
          </div>
            <div class="card-body text-secondary">
                <div class="row p-1">
                    <div class="col-3 col-md-2">CODIGO</div>
                    <div class="col-9 col-md-4">
                        <input required type="text" class="form-control" id="txtCodigoPeriodo" name="txtCodigoPeriodo" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">NOMBRE</div>
                    <div class="col-9 col-md-8">
                        <input required type="text" class="form-control" id="txtNombrePeriodo" name="txtNombrePeriodo" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">DIRECCION</div>
                    <div class="col-9 col-md-10">
                        <input required type="text" class="form-control" id="txtDireccionPeriodo" name="txtDireccionPeriodo" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">TELEFONO</div>
                    <div class="col-9 col-md-10">
                        <input type="text" class="form-control" id="txtTelefonoPeriodo" name="txtTelefonoPeriodo" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-12 text-center">
                        <input type="submit" class="btn btn-outline-primary" value="Guardar" />
                        <input type="reset" class="btn btn-outline-warning" value="Nuevo" />
                        <input type="button" class="btn btn-outline-success" value="Buscar" onclick="abrirVentana('busqueda_periodo')" />
                    </div>
                </div>
            </div>
        </div>
</form>
<script>
    var accion = 'nuevo',
        idPeriodo = 0; 
    frmPeriodo.addEventListener('submit', e => {
        e.preventDefault();
        guardarPeriodo();
    });
    async function guardarPeriodo() {
        let datos = {
            codigo: txtCodigoPeriodo.value,
            nombre: txtNombrePeriodo.value,
            direccion: txtDireccionPeriodo.value,
            telefono: txtTelefonoPeriodo.value
        },
            url = 'https://localhost:7079/api/Periodos',
            method = 'POST';
        if (accion == "modificar") {
            method = 'PUT';
            url = `https://localhost:7079/api/Periodos/${idPeriodo}`;
            datos.idPeriodo = idPeriodo; 
        }
        const respuesta = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }), periodo = await respuesta.json();
        if ((periodo?.idPeriodo || 0) > 0) {
            limpiarDatosPeriodo();
            listarPeriodos();
        }
    
    }
    function limpiarDatosPeriodo() {
        accion = "nuevo";
        idPeriodo = 0;
        txtCodigoPeriodo.value = "";
        txtNombrePeriodo.value = "";
        txtDireccionPeriodo.value = "";
        txtTelefonoPeriodo.value = "";
    }
    function modificarPeriodo(periodo) {

        accion = "modificar";
        idPeriodo = periodo.idPeriodo;
        txtCodigoPeriodo.value = periodo.codigo;
        txtNombrePeriodo.value = periodo.nombre;
        txtDireccionPeriodo.value = periodo.direccion;
        txtTelefonoPeriodo.value = periodo.telefono;
    }

</script>
