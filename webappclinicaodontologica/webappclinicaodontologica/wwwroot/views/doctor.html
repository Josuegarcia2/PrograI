<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Panel del Doctor - SGCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            display: flex;
            margin: 0;
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        /* Barra lateral */
        .sidebar {
            width: 250px;
            background-color: #198754;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

            .sidebar a {
                display: block;
                color: white;
                text-decoration: none;
                margin-bottom: 15px;
                font-size: 1rem;
                transition: 0.3s;
            }

                .sidebar a:hover {
                    text-decoration: underline;
                    transform: translateX(5px);
                }

        /* Contenido principal */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            background-color: #ffffff;
        }

        .logo {
            max-width: 100px;
        }
    </style>
</head>
<body>

    <!-- Menú lateral -->
    <div class="sidebar">
        <div>
            <div class="text-center">
                <img src="/img/logo de la clinica.png" alt="Logo SGCO" class="logo mb-2" />
                <h5 class="fw-bold">CLÍNICA DENTAL SGCO</h5>
            </div>
            <hr />
            <a href="#"><i class="fas fa-user-md"></i> Perfil</a>
            <a href="#"><i class="fas fa-notes-medical"></i> Consultas</a>
            <a href="#"><i class="fas fa-calendar-check"></i> Mis Citas</a>
            <a href="#"><i class="fas fa-user-injured"></i> Pacientes</a>
        </div>

        <div class="text-center mt-4">
            <button id="logoutBtn" class="btn btn-danger w-100">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </button>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content d-flex justify-content-center align-items-center">
        <div class="text-center p-5 rounded shadow" style="max-width: 500px; width: 100%;">
            <h2 class="mb-3">Panel del Doctor</h2>
            <h5 id="bienvenida" class="text-success mb-3"></h5>
            <p class="text-muted mb-4">
                Bienvenido al módulo clínico para gestionar consultas, citas y pacientes.
            </p>
            <img src="/img/logo de la clinica.png" alt="Logo de la clínica" style="max-width: 250px;" />
            <p class="mt-3 text-secondary">CLÍNICA DENTAL SGCO</p>
        </div>
    </div>

    <!-- Script de seguridad y sesión -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const nombre = localStorage.getItem("nombreUsuario");
            const rol = localStorage.getItem("rolUsuario");

            // Validar sesión activa y rol correcto
            if (!nombre || rol !== "Doctor") {
                alert("Debe iniciar sesión como doctor para acceder a este panel.");
                window.location.href = "/Login.html";
                return;
            }

            // Mostrar bienvenida personalizada
            document.getElementById("bienvenida").textContent = `¡Bienvenido, Dr(a). ${nombre}!`;

            // Cerrar sesión
            document.getElementById("logoutBtn").addEventListener("click", () => {
                localStorage.clear();
                window.location.href = "/Login.html";
            });
        });
    </script>

</body>
</html>
