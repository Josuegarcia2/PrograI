<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Recepcionista - SGCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            padding-top: 30px;
            position: fixed;
        }

            .sidebar a {
                display: block;
                padding: 12px 20px;
                color: #333;
                text-decoration: none;
                font-weight: 500;
            }

                .sidebar a:hover {
                    background-color: #e9ecef;
                }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Menú lateral -->
    <div class="sidebar">
        <div class="text-center">
            <img src="/img/logo de la clinica.png" alt="Logo SGCO" class="logo" />
            <h5 class="fw-bold">CLÍNICA DENTAL SGCO</h5>
        </div>
        <hr />
        <a href="#">Perfil</a>
        <a href="#">Citas</a>
        <a href="#">Pacientes</a>
        <a href="#">Servicios</a>
        <a href="#">Reportes</a>
        <a href="#" class="text-danger">Cerrar sesión</a>
    </div>

    <!-- Contenido principal -->
    <div class="main-content d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #ffffff;">
        <div class="text-center p-5 rounded shadow" style="max-width: 500px; width: 100%; background-color: #ffffff; border: 1px solid #dee2e6;">
            <h2 class="mb-3">Panel de Recepcionista</h2>
            <h5 id="bienvenida" class="text-primary mb-3"></h5>
            <p class="text-muted mb-4">Bienvenido al módulo de gestión de citas, pacientes y servicios.</p>

            <!-- Logo centrado -->
            <img src="/img/logo de la clinica.png" alt="Logo de la clínica" style="max-width: 250px;" />
            <p class="mt-3 text-secondary">CLÍNICA DENTAL SGCO</p>
        </div>
    </div>

    <!-- Script para mostrar el nombre -->
    <script>
        const nombre = localStorage.getItem("nombreUsuario");
        if (nombre) {
            document.getElementById("bienvenida").textContent = `¡Bienvenida, ${nombre}!`;
        }
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
