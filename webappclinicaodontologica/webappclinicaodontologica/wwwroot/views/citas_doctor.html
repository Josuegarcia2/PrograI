<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas de Hoy | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        h2 {
            color: #0D5B8C;
            font-weight: 700;
        }

        /* Tarjetas KPI */
        .kpi-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 14px rgba(0,0,0,.1);
            text-align: center;
        }

        .kpi-number {
            font-size: 32px;
            font-weight: 800;
            color: #0D5B8C;
        }

        .kpi-label {
            font-size: 13px;
            color: #6c757d;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        /* Tarjeta tabla */
        .card {
            border-radius: 16px;
            box-shadow: 0px 4px 16px rgba(0,0,0,.12);
            padding: 25px;
            background: white;
        }

        /* ESTADOS */
        .estado-pendiente {
            background: #ffc107 !important;
            color: #000 !important;
        }

        .estado-enproceso {
            background: #17a2b8 !important;
            color: white !important;
        }

        .estado-finalizada {
            background: #28a745 !important;
            color: white !important;
        }

        /* BOTÓN X FLOTANTE */
        #btnCerrarPanel {
            position: fixed;
            top: 20px;
            right: 25px;
            background: white;
            color: #0D5B8C;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 4px 12px rgba(0,0,0,.2);
            font-size: 18px;
            z-index: 2000;
            transition: 0.2s;
        }

            #btnCerrarPanel:hover {
                background: #e2e2e2;
            }
    </style>
</head>

<body>

    <!-- BOTÓN FLOTANTE PARA VOLVER AL PANEL -->
    <div id="btnCerrarPanel" onclick="window.location.href='/views/doctor.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="container py-4">

        <h2 class="mb-4">Mis Citas de Hoy</h2>

        <!-- TARJETAS KPI -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="kpi-card">
                    <div id="totalHoy" class="kpi-number">0</div>
                    <div class="kpi-label">Total de Citas</div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="kpi-card">
                    <div id="pendientesHoy" class="kpi-number">0</div>
                    <div class="kpi-label">Pendientes</div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="kpi-card">
                    <div id="procesoHoy" class="kpi-number">0</div>
                    <div class="kpi-label">En Proceso</div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="kpi-card">
                    <div id="finalizadasHoy" class="kpi-number">0</div>
                    <div class="kpi-label">Finalizadas</div>
                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card">

            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar...">

            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Hora</th>
                        <th>Paciente</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th>Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaDoctor"></tbody>
            </table>

        </div>

    </div>

    <script>
        const API_CITAS_DOCTOR = "/api/Cita/doctor/hoy";

        document.addEventListener("DOMContentLoaded", cargarCitas);

        /* ===============================
           Cargar citas del día
        ================================ */
        function cargarCitas() {
            fetch(API_CITAS_DOCTOR)
                .then(r => r.json())
                .then(data => {

                    // ========= TARJETAS SUPERIORES ========= //
                    let total = data.length;
                    let pendientes = data.filter(c => c.estado === "Pendiente").length;
                    let enProceso = data.filter(c => c.estado === "En Proceso").length;
                    let finalizadas = data.filter(c => c.estado === "Finalizada").length;

                    document.getElementById("totalHoy").innerText = total;
                    document.getElementById("pendientesHoy").innerText = pendientes;
                    document.getElementById("procesoHoy").innerText = enProceso;
                    document.getElementById("finalizadasHoy").innerText = finalizadas;

                    // ========= TABLA ========= //
                    let filas = "";

                    data.forEach(c => {

                        let claseEstado =
                            c.estado === "Pendiente" ? "estado-pendiente" :
                                c.estado === "En Proceso" ? "estado-enproceso" :
                                    "estado-finalizada";

                        filas += `
                                <tr>
                                    <td>${c.hora}</td>
                                    <td>${c.paciente}</td>
                                    <td>${c.motivo}</td>
                                    <td><span class="badge ${claseEstado} px-3 py-2">${c.estado}</span></td>

                                    <td>
                                        <div class="dropdown">
                                            <button class="btn btn-outline-primary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                                                Cambiar
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li><a class="dropdown-item" onclick="actualizarEstado(${c.idCita}, 'Pendiente')">Pendiente</a></li>
                                                <li><a class="dropdown-item" onclick="actualizarEstado(${c.idCita}, 'En Proceso')">En Proceso</a></li>
                                                <li><a class="dropdown-item" onclick="actualizarEstado(${c.idCita}, 'Finalizada')">Finalizada</a></li>
                                            </ul>
                                        </div>
                                    </td>
                                </tr>`;
                    });

                    document.getElementById("tablaDoctor").innerHTML = filas;
                });
        }

        /* ===============================
           Actualizar estado de cita
        ================================ */
        function actualizarEstado(idCita, nuevoEstado) {

            fetch(`/api/Cita/estado/${idCita}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nuevoEstado)
            })
                .then(r => {
                    if (!r.ok) throw new Error("Error al actualizar estado");
                    return r.json();
                })
                .then(() => {
                    cargarCitas();
                })
                .catch(err => {
                    console.error(err);
                    alert("No se pudo cambiar el estado");
                });
        }

        /* ===============================
           Buscador
        ================================ */
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaDoctor tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
