<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios - SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f4f7fb;
            font-family: "Segoe UI";
        }

        /* Botón de salir */
        .btn-salir {
            background: white;
            border: 2px solid #dce3ee;
            color: #555;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: .25s;
        }

            .btn-salir:hover {
                background: #0d6efd;
                color: white;
                border-color: #0d6efd;
            }

        h2 {
            color: #0D5B8C;
            font-weight: 900;
            letter-spacing: -.5px;
        }

        .card {
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border: none;
        }

        .table thead {
            background: #0D5B8C;
            color: white;
        }

        .badge-activo {
            background: #0db46c;
            padding: 8px 14px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
        }

        .badge-inactivo {
            background: #d9534f;
            padding: 8px 14px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
        }

        /* Inputs modernos */
        .modern-input {
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid #cbd4e1;
            transition: .2s;
        }

            .modern-input:focus {
                border-color: #0D5B8C;
                box-shadow: 0 0 5px rgba(13,91,140,0.3);
            }

        /* Botón agregar */
        .btn-add {
            background: #0D5B8C;
            border: none;
        }

            .btn-add:hover {
                background: #094b6c;
            }
    </style>
</head>

<body>

    <!-- Botón salir -->
    <div class="p-3 text-end">
        <a href="/views/administrador.html" class="btn-salir">
            <i class="bi bi-x-lg"></i>
        </a>
    </div>

    <div class="container mt-2">

        <!-- Título -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestión de Servicios</h2>

            <button class="btn btn-add text-white" onclick="nuevoServicio()">
                <i class="bi bi-plus-circle"></i> Nuevo Servicio
            </button>
        </div>

        <!-- Buscador -->
        <input type="text" id="txtBuscar" class="form-control modern-input mb-3"
               placeholder="🔍 Buscar servicio..." onkeyup="buscarServicio()">

        <!-- Tabla -->
        <div class="card">
            <table class="table table-hover text-center align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Servicio</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyServicios"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalServicio">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header text-white" style="background:#0D5B8C;">
                    <h5 class="modal-title" id="tituloModal">Nuevo Servicio</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="idServicio">

                    <label>Nombre</label>
                    <input class="form-control modern-input mb-3" id="nombre">

                    <label>Precio ($)</label>
                    <input type="number" class="form-control modern-input mb-3" id="precio">

                    <label>Descripción</label>
                    <textarea class="form-control modern-input mb-3" id="descripcion"></textarea>

                    <label>Estado</label>
                    <select id="estado" class="form-select modern-input mb-3">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-add text-white" onclick="guardarServicio()">Guardar</button>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const API = "https://localhost:7148/api/Servicio";

        /* =============================
              Cargar servicios
        ============================= */
        async function cargarServicios() {
            const resp = await fetch(API);
            const lista = await resp.json();

            let html = "";
            lista.forEach(s => {
                html += `
                <tr>
                    <td>${s.idServicio}</td>
                    <td>${s.nombre}</td>
                    <td>$${s.precio.toFixed(2)}</td>
                    <td>
                        <span class="badge ${s.estado === "Activo" ? "badge-activo" : "badge-inactivo"}">
                            ${s.estado}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(s)})'>
                            <i class="bi bi-pencil"></i>
                        </button>

                        <button class="btn btn-danger btn-sm" onclick='eliminar(${s.idServicio})'>
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>`;
            });

            document.getElementById("tbodyServicios").innerHTML = html;
        }

        cargarServicios();

        /* =============================
              Nuevo servicio
        ============================= */
        function nuevoServicio() {
            limpiar();
            document.getElementById("tituloModal").innerText = "Nuevo Servicio";
            new bootstrap.Modal(document.getElementById("modalServicio")).show();
        }

        /* =============================
              Editar
        ============================= */
        function editar(s) {
            idServicio.value = s.idServicio;
            nombre.value = s.nombre;
            precio.value = s.precio;
            descripcion.value = s.descripcion;
            estado.value = s.estado;

            document.getElementById("tituloModal").innerText = "Editar Servicio";
            new bootstrap.Modal(document.getElementById("modalServicio")).show();
        }

        /* =============================
              Guardar
        ============================= */
        async function guardarServicio() {

            let data = new FormData();
            data.append("IdServicio", idServicio.value || 0);
            data.append("Nombre", nombre.value);
            data.append("Precio", precio.value);
            data.append("Descripcion", descripcion.value);
            data.append("Estado", estado.value);

            let id = idServicio.value;
            let metodo = id == 0 ? "POST" : "PUT";
            let url = id == 0 ? API : `${API}/${id}`;

            const resp = await fetch(url, { method: metodo, body: data });

            if (!resp.ok) {
                Swal.fire("Error", "No se pudo guardar el servicio", "error");
                return;
            }

            Swal.fire("Éxito", "Guardado correctamente", "success");
            bootstrap.Modal.getInstance(document.getElementById("modalServicio")).hide();
            cargarServicios();
        }

        /* =============================
              Eliminar
        ============================= */
        async function eliminar(id) {

            const conf = await Swal.fire({
                title: "¿Eliminar servicio?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, eliminar",
                cancelButtonText: "Cancelar"
            });

            if (!conf.isConfirmed) return;

            await fetch(`${API}/${id}`, { method: "DELETE" });

            Swal.fire("Eliminado", "Servicio eliminado correctamente", "success");

            cargarServicios();
        }

        /* =============================
              Limpiar modal
        ============================= */
        function limpiar() {
            idServicio.value = "";
            nombre.value = "";
            precio.value = "";
            descripcion.value = "";
            estado.value = "Activo";
        }

        /* =============================
              Buscar servicio
        ============================= */
        function buscarServicio() {
            let texto = txtBuscar.value.toLowerCase();
            document.querySelectorAll("#tbodyServicios tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        }

    </script>

</body>
</html>
