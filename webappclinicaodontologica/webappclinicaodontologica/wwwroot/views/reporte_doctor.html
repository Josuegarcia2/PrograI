<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte Clínico | Doctor SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background: #eaf4ff;
            font-family: "Segoe UI";
        }

        h2 {
            font-weight: 800;
            color: #004e92;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        .btn-x {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,.2);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="btn-x" onclick="window.location.href='doctor.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="container mt-4">

        <h2 class="mb-3">Reporte Clínico del Paciente</h2>

        <!-- BUSCADOR -->
        <div class="card p-3 mb-3">
            <label class="fw-bold">Buscar paciente:</label>
            <input type="text" id="buscarPaciente" class="form-control" placeholder="Escribe un nombre...">
            <table class="table table-hover mt-3">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="listaPacientes"></tbody>
            </table>
        </div>

        <!-- REPORTE -->
        <div id="reporteCompleto" class="card p-4" style="display:none;">

            <h3 id="tituloPaciente" class="fw-bold"></h3>

            <hr>

            <h5 class="mt-3"><i class="bi bi-file-medical"></i> Historial Clínico</h5>
            <table class="table table-bordered mt-2">
                <thead class="table-light">
                    <tr>
                        <th>Fecha</th>
                        <th>Diagnóstico</th>
                        <th>Tratamiento sugerido</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>

            <h5 class="mt-3"><i class="bi bi-clipboard2-pulse"></i> Tratamientos Realizados</h5>
            <table class="table table-bordered mt-2">
                <thead class="table-light">
                    <tr>
                        <th>Fecha</th>
                        <th>Observaciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTratamientos"></tbody>
            </table>

            <button class="btn btn-danger mt-3" onclick="exportarPDF()">
                <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
            </button>
        </div>

    </div>

    <script>
        const API_PACIENTE = "/api/Paciente";
        const API_HISTORIAL = "/api/Historial";
        const API_TRAT = "/api/Tratamientos";

        document.addEventListener("DOMContentLoaded", cargarPacientes);

        function cargarPacientes() {
            fetch(API_PACIENTE).then(r => r.json()).then(data => {
                let html = "";
                data.forEach(p => {
                    html += `
                        <tr>
                            <td>${p.idPaciente}</td>
                            <td>${p.nombre}</td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="verReporte(${p.idPaciente})">
                                    Ver reporte
                                </button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById("listaPacientes").innerHTML = html;
            });
        }

        function verReporte(id) {
            document.getElementById("reporteCompleto").style.display = "block";

            fetch(`${API_PACIENTE}/${id}`).then(r => r.json()).then(p => {
                document.getElementById("tituloPaciente").innerText = `Paciente: ${p.nombre}`;
            });

            fetch(`${API_HISTORIAL}/paciente/${id}`).then(r => r.json()).then(data => {
                let html = "";
                data.forEach(h => {
                    html += `
                        <tr>
                            <td>${h.fechaRegistro.split("T")[0]}</td>
                            <td>${h.diagnostico}</td>
                            <td>${h.tratamientoSugerido}</td>
                        </tr>`;
                });
                document.getElementById("tablaHistorial").innerHTML = html;
            });

            fetch(`${API_TRAT}/paciente/${id}`).then(r => r.json()).then(data => {
                let html = "";
                data.forEach(t => {
                    html += `
                        <tr>
                            <td>${t.fecha.split("T")[0]}</td>
                            <td>${t.observaciones}</td>
                        </tr>`;
                });
                document.getElementById("tablaTratamientos").innerHTML = html;
            });
        }

        async function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const card = document.getElementById("reporteCompleto");

            const canvas = await html2canvas(card);
            const img = canvas.toDataURL("image/png");

            let pdf = new jsPDF("p", "mm", "a4");
            let width = 210;
            let height = canvas.height * width / canvas.width;

            pdf.addImage(img, "PNG", 0, 0, width, height);
            pdf.save("Reporte_Clinico.pdf");
        }
    </script>

</body>
</html>
