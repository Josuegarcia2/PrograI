<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso SGCO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #00b4d8, #90e0ef, #caf0f8);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

            .login-box h2 {
                margin-bottom: 30px;
                color: #0077b6;
            }

        .form-control {
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .btn-ingresar {
            background-color: #00b4d8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

            .btn-ingresar:hover {
                background-color: #0077b6;
            }

        #msgError {
            display: none;
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2><i class="fa-solid fa-tooth"></i> Acceso SGCO</h2>
        <form id="form-login">
            <select id="rol" class="form-control">
                <option value="1">Recepcionista</option>
                <option value="2">Doctor</option>
                <option value="3">Administrador</option>
            </select>

            <input type="text" id="usuario" class="form-control" placeholder="Usuario">
            <input type="password" id="contrasena" class="form-control" placeholder="Contraseña">
            <button id="btnIngresar" type="button" class="btn-ingresar">INGRESAR</button>
        </form>
        <div id="msgError">❌ Usuario o contraseña incorrectos</div>
    </div>

    <script>
        document.getElementById("btnIngresar").addEventListener("click", function () {
            const nombre = document.getElementById("usuario").value.trim();
            const contrasena = document.getElementById("contrasena").value.trim();

            if (nombre === "" || contrasena === "") {
                alert("Por favor, complete todos los campos.");
                return;
            }

            const datos = { nombre, contrasena };

            fetch("http://localhost:7048/api/Login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
                .then(res => {
                    if (!res.ok) throw new Error("Credenciales inválidas");
                    return res.json();
                })
                .then(data => {
                    localStorage.setItem("usuario", JSON.stringify(data));
                    switch (data.rol_id) {
                        case 1: window.location.href = "recepcionista.html"; break;
                        case 2: window.location.href = "doc.html"; break;
                        case 3: window.location.href = "admi.html"; break;
                        default: alert("Rol no reconocido."); break;
                    }
                })
                .catch(err => {
                    document.getElementById("msgError").style.display = "block";
                });
        });
    </script>
</body>
</html>
