<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas | Recepcionista</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        h2 {
            color: #0D5B8C;
            font-weight: 700;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgba(0,0,0,.1);
        }

        .table thead {
            background: #0D5B8C;
            color: white;
        }

        .btn-primary {
            background: #0D5B8C;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between mb-3">
            <h2>Gestión de Citas</h2>

            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAgregar">
                <i class="bi bi-plus-lg"></i> Nueva Cita
            </button>
        </div>

        <div class="card p-3">
            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar...">

            <div class="table-responsive">
                <table class="table table-hover" id="tablaCitas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Doctor</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MODAL AGREGAR -->
    <div class="modal fade" id="modalAgregar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header" style="background:#0D5B8C;color:white;">
                    <h5 class="modal-title">Nueva Cita</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <label>Paciente</label>
                    <select id="IdPaciente" class="form-control mb-2"></select>

                    <label>Fecha</label>
                    <input type="date" id="Fecha" class="form-control mb-2">

                    <label>Hora disponible</label>
                    <select id="Hora" class="form-control mb-2"></select>

                    <label>Motivo</label>
                    <textarea id="Motivo" class="form-control mb-2"></textarea>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarCita()">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header" style="background:#0D5B8C;color:white;">
                    <h5 class="modal-title">Editar Cita</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editIdCita">

                    <label>Paciente</label>
                    <select id="editIdPaciente" class="form-control mb-2"></select>

                    <label>Fecha</label>
                    <input type="date" id="editFecha" class="form-control mb-2">

                    <label>Hora disponible</label>
                    <select id="editHora" class="form-control mb-2"></select>

                    <label>Motivo</label>
                    <textarea id="editMotivo" class="form-control mb-2"></textarea>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarEdicion()">Actualizar</button>
                </div>

            </div>
        </div>
    </div>


    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_PACIENTES = "/api/Paciente";
        const API_CITAS = "/api/Cita";

        // ======================
        // CARGAR PACIENTES
        // ======================
        function cargarPacientes(selectId = "IdPaciente") {
            fetch(API_PACIENTES)
                .then(r => r.json())
                .then(data => {
                    let html = "";
                    data.forEach(p => {
                        html += `<option value="${p.idPaciente}">${p.nombre}</option>`;
                    });
                    document.getElementById(selectId).innerHTML = html;
                });
        }

        // ======================
        // CARGAR HORAS DISPONIBLES
        // ======================
        function cargarHorasDisponibles(fecha, selectId = "Hora") {
            fetch(`/api/Cita/horas-disponibles/${fecha}`)
                .then(r => r.json())
                .then(data => {
                    let html = "";
                    data.forEach(h => html += `<option value="${h}">${h}</option>`);
                    document.getElementById(selectId).innerHTML = html;
                });
        }

        // ======================
        // AL CAMBIAR FECHA EN AGREGAR
        // ======================
        document.addEventListener("DOMContentLoaded", () => {
            cargarPacientes();
            cargarCitas();

            document.getElementById("Fecha").addEventListener("change", () => {
                let f = document.getElementById("Fecha").value;
                if (f) cargarHorasDisponibles(f, "Hora");
            });

            document.getElementById("editFecha").addEventListener("change", () => {
                let f = document.getElementById("editFecha").value;
                if (f) cargarHorasDisponibles(f, "editHora");
            });
        });

        // ======================
        // BUSCAR FILTRAR
        // ======================
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaCitas tbody tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });

        // ======================
        // CARGAR CITAS
        // ======================
        function cargarCitas() {
            fetch(API_CITAS)
                .then(r => r.json())
                .then(data => {
                    let filas = "";
                    data.forEach(c => {
                        filas += `
                    <tr>
                        <td>${c.idCita}</td>
                        <td>${c.paciente}</td>
                        <td>${c.doctor}</td>
                        <td>${c.fecha.split("T")[0]}</td>
                        <td>${c.hora}</td>
                        <td>${c.motivo}</td>
                        <td>${c.estado}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="abrirEditar(${c.idCita})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarCita(${c.idCita})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    `;
                    });

                    document.querySelector("#tablaCitas tbody").innerHTML = filas;
                });
        }

        // ======================
        // GUARDAR CITA
        // ======================
        function guardarCita() {
            let data = {
                idPaciente: parseInt(document.getElementById("IdPaciente").value),
                doctor: "Doctor General",
                fecha: document.getElementById("Fecha").value,
                hora: document.getElementById("Hora").value,
                motivo: document.getElementById("Motivo").value
            };

            fetch(API_CITAS, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(async r => {
                    if (!r.ok) {
                        const res = await r.json();
                        alert(res.mensaje);
                        return;
                    }
                    cargarCitas();
                    bootstrap.Modal.getInstance(document.getElementById("modalAgregar")).hide();
                });
        }

        // ======================
        // ABRIR EDITAR
        // ======================
        function abrirEditar(id) {
            fetch(API_CITAS + "/" + id)
                .then(r => r.json())
                .then(c => {
                    document.getElementById("editIdCita").value = c.idCita;
                    cargarPacientes("editIdPaciente");
                    document.getElementById("editIdPaciente").value = c.idPaciente;

                    document.getElementById("editFecha").value = c.fecha.split("T")[0];

                    cargarHorasDisponibles(c.fecha.split("T")[0], "editHora");

                    setTimeout(() => {
                        document.getElementById("editHora").value = c.hora;
                    }, 300);

                    document.getElementById("editMotivo").value = c.motivo;

                    new bootstrap.Modal(document.getElementById("modalEditar")).show();
                });
        }

        // ======================
        // GUARDAR EDICIÓN
        // ======================
        function guardarEdicion() {
            let id = document.getElementById("editIdCita").value;

            let data = {
                idCita: parseInt(id),
                idPaciente: parseInt(document.getElementById("editIdPaciente").value),
                doctor: "Doctor General",
                fecha: document.getElementById("editFecha").value,
                hora: document.getElementById("editHora").value,
                motivo: document.getElementById("editMotivo").value
            };

            fetch(API_CITAS + "/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(() => {
                    cargarCitas();
                    bootstrap.Modal.getInstance(document.getElementById("modalEditar")).hide();
                });
        }

        // ======================
        // ELIMINAR
        // ======================
        function eliminarCita(id) {
            if (!confirm("¿Eliminar esta cita?")) return;

            fetch(API_CITAS + "/" + id, { method: "DELETE" })
                .then(() => cargarCitas());
        }

    </script>

</body>
</html>
