<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Historial Clínico | Doctor SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SWEETALERT2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #e6f7f8;
            font-family: 'Segoe UI', sans-serif;
        }

        h2 {
            color: #0d6e6e;
            font-weight: 800;
        }

        .card {
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .1);
            padding: 22px;
        }

        .btn-principal {
            background: #0d6e6e;
            color: white;
        }

            .btn-principal:hover {
                background: #094d4d;
            }

        .btn-editar {
            background: #0d6efd;
            color: white;
        }

        .btn-eliminar {
            background: #dc3545;
            color: white;
        }

        .btn-cerrar-flotante {
            position: absolute;
            top: 25px;
            right: 30px;
            padding: 8px 15px;
            background: #6c757d;
            color: white;
            border-radius: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>

    <!-- BOTÓN CERRAR -->
    <button class="btn btn-cerrar-flotante" onclick="window.location.href='doctor.html'">
        <i class="bi bi-x-lg"></i> Cerrar
    </button>

    <div class="container py-4">

        <h2>Historial Clínico</h2>

        <!-- BUSCADOR DE PACIENTES -->
        <div id="buscadorPacientes" class="card mt-3">
            <h5>Buscar Paciente</h5>
            <input type="text" class="form-control mt-2 mb-3"
                   id="buscarPaciente" placeholder="Escribe el nombre del paciente...">

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaPacientes"></tbody>
            </table>
        </div>

        <!-- HISTORIAL DEL PACIENTE -->
        <div id="contenedorHistorial" class="card mt-4" style="display:none;">
            <h4 id="tituloPaciente"></h4>

            <div class="d-flex justify-content-end mb-2">
                <button class="btn btn-principal" onclick="abrirModalAgregar()">
                    <i class="bi bi-plus-circle"></i> Agregar Registro
                </button>
            </div>

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Diagnóstico</th>
                        <th>Tratamiento Sugerido</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>

    </div>

    <!-- MODAL AGREGAR -->
    <div class="modal fade" id="modalAgregar">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Agregar Registro Clínico</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label>Diagnóstico:</label>
                    <textarea id="diagAgregar" class="form-control"></textarea>

                    <label class="mt-3">Tratamiento Sugerido:</label>
                    <textarea id="tratAgregar" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-principal" onclick="guardarNuevo()">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Editar Registro Clínico</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="editId">

                    <label>Diagnóstico:</label>
                    <textarea id="diagEditar" class="form-control"></textarea>

                    <label class="mt-3">Tratamiento Sugerido:</label>
                    <textarea id="tratEditar" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-principal" onclick="guardarEdicion()">Actualizar</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const API_PACIENTES = "/api/Paciente";
        const API_HISTORIAL = "/api/Historial";

        let pacienteSeleccionado = null;

        document.addEventListener("DOMContentLoaded", () => cargarPacientes());

        /* ==========================
           CARGAR PACIENTES
        ========================== */
        function cargarPacientes() {
            fetch(API_PACIENTES)
                .then(r => r.json())
                .then(data => {
                    let html = "";
                    data.forEach(p => {
                        html += `
                                <tr>
                                    <td>${p.idPaciente}</td>
                                    <td>${p.nombre}</td>
                                    <td>
                                        <button class="btn btn-sm btn-principal"
                                            onclick="cargarHistorial(${p.idPaciente})">
                                            Ver historial
                                        </button>
                                    </td>
                                </tr>`;
                    });

                    document.getElementById("tablaPacientes").innerHTML = html;
                });
        }

        document.getElementById("buscarPaciente").addEventListener("keyup", () => {
            let texto = buscarPaciente.value.toLowerCase();
            document.querySelectorAll("#tablaPacientes tr").forEach(f =>
                f.style.display = f.innerText.toLowerCase().includes(texto) ? "" : "none");
        });

        /* ==========================
           CARGAR HISTORIAL
        ========================== */
        function cargarHistorial(idPaciente) {

            pacienteSeleccionado = idPaciente;

            document.getElementById("buscadorPacientes").style.display = "none";
            document.getElementById("contenedorHistorial").style.display = "block";

            fetch(`${API_PACIENTES}/${idPaciente}`)
                .then(r => r.json())
                .then(p => {
                    document.getElementById("tituloPaciente").innerHTML =
                        `<strong>Paciente:</strong> ${p.nombre}`;
                });

            fetch(`${API_HISTORIAL}/paciente/${idPaciente}`)
                .then(r => r.json())
                .then(data => {
                    let filas = "";

                    data.forEach(h => {
                        filas += `
                                <tr>
                                    <td>${h.fechaRegistro.split("T")[0]}</td>
                                    <td>${h.diagnostico}</td>
                                    <td>${h.tratamientoSugerido}</td>
                                    <td>
                                        <button class="btn btn-sm btn-editar"
                                            onclick="abrirModalEditar(${h.idHistorial},
                                            \`${h.diagnostico}\`, \`${h.tratamientoSugerido}\`)">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <button class="btn btn-sm btn-eliminar"
                                            onclick="eliminar(${h.idHistorial})">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>`;
                    });

                    document.getElementById("tablaHistorial").innerHTML = filas;
                });
        }

        /* ==========================
           AGREGAR REGISTRO
        ========================== */
        function abrirModalAgregar() {
            diagAgregar.value = "";
            tratAgregar.value = "";
            new bootstrap.Modal(modalAgregar).show();
        }

        function guardarNuevo() {

            const data = {
                idPaciente: pacienteSeleccionado,
                idDoctor: 1,
                diagnostico: diagAgregar.value,
                tratamientoSugerido: tratAgregar.value
            };

            fetch(API_HISTORIAL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(() => {
                    Swal.fire({
                        icon: "success",
                        title: "Registro agregado",
                        text: "El historial fue guardado correctamente.",
                        confirmButtonColor: "#0d6e6e"
                    }).then(() => location.reload());
                });
        }

        /* ==========================
           EDITAR REGISTRO
        ========================== */
        function abrirModalEditar(id, diag, trat) {
            editId.value = id;
            diagEditar.value = diag;
            tratEditar.value = trat;
            new bootstrap.Modal(modalEditar).show();
        }

        function guardarEdicion() {
            const id = editId.value;

            const data = {
                idPaciente: pacienteSeleccionado,
                idDoctor: 1,
                diagnostico: diagEditar.value,
                tratamientoSugerido: tratEditar.value
            };

            fetch(`${API_HISTORIAL}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(() => {
                    Swal.fire({
                        icon: "success",
                        title: "Registro actualizado",
                        text: "Los datos fueron guardados correctamente.",
                        confirmButtonColor: "#0d6e6e"
                    }).then(() => location.reload());
                });
        }

        /* ==========================
           ELIMINAR REGISTRO
        ========================== */
        function eliminar(id) {

            Swal.fire({
                title: "¿Eliminar registro?",
                text: "Esta acción no puede deshacerse.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                cancelButtonColor: "#6c757d",
                confirmButtonText: "Eliminar",
                cancelButtonText: "Cancelar"
            }).then(result => {
                if (!result.isConfirmed) return;

                fetch(`${API_HISTORIAL}/${id}`, { method: "DELETE" })
                    .then(() => {
                        Swal.fire({
                            icon: "success",
                            title: "Registro eliminado",
                            text: "El historial fue eliminado correctamente.",
                            confirmButtonColor: "#0d6e6e"
                        }).then(() => location.reload());
                    });
            });

        }

    </script>

</body>
</html>
