<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Recepcionista</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f8ff;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 240px;
            background-color: #0077b6;
            color: white;
            padding-top: 40px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

            .sidebar h3 {
                text-align: center;
                margin-bottom: 30px;
                font-weight: bold;
            }

            .sidebar ul {
                list-style: none;
                padding: 0;
            }

                .sidebar ul li {
                    padding: 15px 20px;
                    cursor: pointer;
                    transition: background-color 0.3s ease;
                }

                    .sidebar ul li:hover {
                        background-color: #023e8a;
                    }

                    .sidebar ul li i {
                        margin-right: 10px;
                    }

        .main-content {
            margin-left: 240px;
            padding: 40px;
        }

        .section {
            display: none;
        }

            .section.active {
                display: block;
            }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 20px;
            color: #ffd6d6;
            cursor: pointer;
        }

            .logout:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Recepcionista</h3>
        <ul>
            <li onclick="mostrarSeccion('perfil')"><i class="fa-solid fa-user"></i> Perfil</li>
            <li onclick="mostrarSeccion('citas')"><i class="fa-solid fa-calendar-plus"></i> Citas</li>
        </ul>
        <div class="logout" onclick="cerrarSesion()">🔒 Cerrar sesión</div>
    </div>

    <div class="main-content">
        <div id="perfil" class="section active">
            <h2>Mi Perfil</h2>
            <form id="formPerfil" class="card shadow-sm p-4 mt-3" style="max-width: 600px;">
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="nombreCompleto" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuarioNombre" readonly>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo">
                    </div>
                    <div class="col">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion">
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Rol</label>
                        <input type="text" class="form-control" id="rolNombre" readonly>
                    </div>
                    <div class="col">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Actualizar perfil</button>
                <div id="perfilMsg" class="mt-3 text-success" style="display:none;">✅ Perfil actualizado correctamente.</div>
            </form>
        </div>

        <div id="citas" class="section">
            <h2>Registrar Cita</h2>
            <form id="formCita" class="card shadow-sm p-4 mt-3" style="max-width: 600px;">
                <div class="mb-3">
                    <label class="form-label">Paciente ID</label>
                    <input type="number" class="form-control" id="pacienteId" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" id="fechaCita" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Hora</label>
                    <input type="time" class="form-control" id="horaCita" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Motivo</label>
                    <textarea class="form-control" id="motivoCita" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Registrar cita</button>
                <div id="citaMsg" class="mt-3 text-success" style="display:none;">✅ Cita registrada correctamente.</div>
            </form>
        </div>
    </div>

    <script>
        function mostrarSeccion(id) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function cerrarSesion() {
            localStorage.removeItem("usuario");
            window.location.href = "login.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const usuario = JSON.parse(localStorage.getItem("usuario"));
            if (!usuario) {
                alert("No hay sesión activa.");
                window.location.href = "login.html";
                return;
            }

            // Cargar datos en el formulario de perfil
            document.getElementById("usuarioNombre").value = usuario.usuario_nombre;
            document.getElementById("contrasena").value = usuario.contrasena;
            document.getElementById("nombreCompleto").value = usuario.nombre_completo || "";
            document.getElementById("correo").value = usuario.correo || "";
            document.getElementById("telefono").value = usuario.telefono || "";
            document.getElementById("direccion").value = usuario.direccion || "";

            let rolNombre = "";
            switch (usuario.rol_id) {
                case 1: rolNombre = "Recepcionista"; break;
                case 2: rolNombre = "Doctor"; break;
                case 3: rolNombre = "Administrador"; break;
                default: rolNombre = "Desconocido";
            }
            document.getElementById("rolNombre").value = rolNombre;
        });

        // Actualizar perfil
        document.getElementById("formPerfil").addEventListener("submit", function (e) {
            e.preventDefault();

            const datosActualizados = {
                usuario_nombre: document.getElementById("usuarioNombre").value,
                contrasena: document.getElementById("contrasena").value,
                nombre_completo: document.getElementById("nombreCompleto").value,
                correo: document.getElementById("correo").value,
                telefono: document.getElementById("telefono").value,
                direccion: document.getElementById("direccion").value
            };

            fetch("http://localhost:7148/api/Usuario/ActualizarPerfil", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datosActualizados)
            })
                .then(res => {
                    if (!res.ok) throw new Error("Error al actualizar perfil");
                    return res.json();
                })
                .then(data => {
                    localStorage.setItem("usuario", JSON.stringify(data));
                    document.getElementById("perfilMsg").style.display = "block";
                })
                .catch(err => alert("❌ " + err.message));
        });

        // Registrar cita
        document.getElementById("formCita").addEventListener("submit", function (e) {
            e.preventDefault();

            const nuevaCita = {
                paciente_id: parseInt(document.getElementById("pacienteId").value),
                fecha: document.getElementById("fechaCita").value,
                hora: document.getElementById("horaCita").value,
                motivo: document.getElementById("motivoCita").value
            };

            fetch("http://localhost:7148/api/Cita", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nuevaCita)
            })
                .then(res => {
                    if (!res.ok) throw new Error("Error al registrar cita");
                    return res.json();
                })
                .then(data => {
                    document.getElementById("formCita").reset();
                    document.getElementById("citaMsg").style.display = "block";
                })
                .catch(err => alert("❌ " + err.message));
        });
    </script>


</body>
</html>
