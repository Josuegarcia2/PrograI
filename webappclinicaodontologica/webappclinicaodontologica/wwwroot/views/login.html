<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - SGCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            z-index: 1;
        }

            .login-container img {
                width: 100px;
                margin-bottom: 15px;
            }

            .login-container h3 {
                font-weight: bold;
                margin-bottom: 5px;
            }

            .login-container p {
                font-size: 0.95rem;
                color: #6c757d;
                margin-bottom: 25px;
            }

        .decoracion-cuadro {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #17a2b8;
            opacity: 0.3;
            animation: flotar 10s infinite;
        }

        @keyframes flotar {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Decoración visual -->
    <script>
        for (let i = 0; i < 30; i++) {
            const cuadro = document.createElement("div");
            cuadro.className = "decoracion-cuadro";
            cuadro.style.top = Math.random() * window.innerHeight + "px";
            cuadro.style.left = Math.random() * window.innerWidth + "px";
            document.body.appendChild(cuadro);
        }
    </script>

    <!-- Formulario de login -->
    <div class="login-container text-center">
        <img src="/img/logo de la clinica.png" alt="Logo SGCO" />
        <h3>SGCO</h3>
        <p>Sistema de Gestión de Consultorios Odontológicos</p>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label for="rol" class="form-label">Rol</label>
                <select id="rol" class="form-select" required>
                    <option value="">Seleccione su rol</option>
                    <option value="1">Recepcionista</option>
                    <option value="2">Doctor</option>
                    <option value="3">Administrador</option>
                </select>
            </div>
            <div class="mb-3 text-start">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario" required />
            </div>
            <div class="mb-4 text-start">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" placeholder="Ingrese su contraseña" required />
            </div>
            <button type="submit" class="btn btn-info w-100 py-2">INGRESAR</button>
        </form>

        <div id="errorMsg" class="alert alert-danger mt-3 d-none"></div>
    </div>

    <!-- Script de login -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;

            const respuesta = await fetch("https://localhost:7148/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario, contrasena })
            });

            if (respuesta.ok) {
                const datos = await respuesta.json();

                // Guardar datos del usuario en localStorage
                localStorage.setItem("nombreUsuario", datos.nombre);
                localStorage.setItem("rolUsuario", datos.rol);

                const panel = datos.panelDestino;

                if (panel === "PanelRecepcionista") {
                    window.location.href = "/views/recepcionista.html";
                } else if (panel === "PanelDoctor") {
                    window.location.href = "/views/Doctor.html";
                } else if (panel === "PanelAdministrador") {
                    window.location.href = "/views/Administrador.html";
                }

            } else {
                const errorMsg = document.getElementById("errorMsg");
                errorMsg.textContent = "Usuario o contraseña incorrectos";
                errorMsg.classList.remove("d-none");
            }
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
