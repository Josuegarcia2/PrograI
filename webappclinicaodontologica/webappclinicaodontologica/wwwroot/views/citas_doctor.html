<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas de Hoy | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        h2 {
            color: #0D5B8C;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .card {
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,.1);
            padding: 20px;
        }

        .btn-estado {
            border-radius: 8px;
            padding: 6px 12px;
        }

        .estado-pendiente {
            background: #ffc107;
            color: black;
        }

        .estado-enproceso {
            background: #0dcaf0;
            color: white;
        }

        .estado-finalizada {
            background: #28a745;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center">
            <h2>Mis Citas de Hoy</h2>

            <a href="/views/doctor.html" class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i> Volver al Panel
            </a>
        </div>

        <div class="card mt-3">

            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar...">

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Paciente</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th>Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaDoctor"></tbody>
            </table>

        </div>

    </div>

    <script>

        const API_CITAS_DOCTOR = "/api/Cita/doctor/hoy";

        // =======================
        // Cargar citas del día
        // =======================
        document.addEventListener("DOMContentLoaded", cargarCitas);

        function cargarCitas() {
            fetch(API_CITAS_DOCTOR)
                .then(r => r.json())
                .then(data => {

                    let filas = "";
                    data.forEach(c => {

                        let claseEstado =
                            c.estado === "Pendiente" ? "estado-pendiente" :
                                c.estado === "En Proceso" ? "estado-enproceso" :
                                    "estado-finalizada";

                        filas += `
                        <tr>
                            <td>${c.hora}</td>
                            <td>${c.paciente}</td>
                            <td>${c.motivo}</td>
                            <td><span class="badge ${claseEstado}">${c.estado}</span></td>
                            <td>
                                <button class="btn btn-primary btn-sm"
                                    onclick="cambiarEstado(${c.idCita}, '${c.estado}')">
                                    Cambiar
                                </button>
                            </td>
                        </tr>
                    `;
                    });

                    document.getElementById("tablaDoctor").innerHTML = filas;
                });
        }

        // =======================
        // Cambiar estado
        // =======================
        function cambiarEstado(id, estadoActual) {

            let nuevoEstado =
                estadoActual === "Pendiente" ? "En Proceso" :
                    estadoActual === "En Proceso" ? "Finalizada" :
                        "Finalizada";

            fetch(`/api/Cita/estado/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nuevoEstado)
            })
                .then(r => r.json())
                .then(() => cargarCitas());
        }

        // =======================
        // Buscador
        // =======================
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaDoctor tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });

    </script>

</body>
</html>
