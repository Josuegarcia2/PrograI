<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios - Recepcionista | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        #btnCerrarPanel {
            position: fixed;
            top: 15px;
            right: 20px;
            background: white;
            color: #0D5B8C;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 2px 6px rgba(0,0,0,.2);
            z-index: 2000;
        }

            #btnCerrarPanel:hover {
                background: #e6e6e6;
            }

        h2 {
            font-weight: 800;
            color: #0D5B8C;
        }

        .service-card {
            border-radius: 16px;
            padding: 25px;
            background: white;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: .25s;
        }

            .service-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 22px rgba(0,0,0,0.12);
            }

        .search-box {
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 17px;
        }

        .modal-header {
            background: #0D5B8C;
            color: white;
        }

        .service-icon {
            font-size: 60px;
            color: #0D5B8C;
        }
    </style>
</head>

<body>

    <div id="btnCerrarPanel" onclick="window.location.href='recepcionista.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="container py-4">
        <h2 class="mb-4">Servicios Disponibles</h2>

        <div class="card mb-3 p-3">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="buscar" class="form-control search-box"
                       placeholder="Buscar servicio..." onkeyup="filtrarServicios()">
            </div>
        </div>

        <div class="row g-4" id="contenedorServicios"></div>
    </div>

    <!-- Modal Detalle del Servicio -->
    <div class="modal fade" id="modalServicio" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo"></h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="text-center mb-3">
                        <i class="bi bi-briefcase-fill service-icon"></i>
                    </div>

                    <h4 class="fw-bold text-center" id="modalNombre"></h4>
                    <h5 class="text-success text-center" id="modalPrecio"></h5>

                    <p class="mt-3" id="modalDescripcion"></p>

                    <span class="badge bg-success" id="modalEstado"></span>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = "/api/Servicio";

        document.addEventListener("DOMContentLoaded", () => cargarServicios());

        async function cargarServicios() {
            const res = await fetch(API);
            const servicios = await res.json();

            let html = "";
            servicios.forEach(s => {
                html += `
                        <div class="col-md-4 col-lg-3">
                            <div class="service-card" onclick='verServicio(${JSON.stringify(s)})'>
                                <div class="text-center mb-2">
                                    <i class="bi bi-briefcase-fill" style="font-size:40px;color:#0D5B8C"></i>
                                </div>

                                <h5 class="fw-bold">${s.nombre}</h5>
                                <h6 class="text-success">$${s.precio.toFixed(2)}</h6>

                                <p class="text-muted" style="font-size:14px; height:70px; overflow:hidden;">
                                    ${s.descripcion}
                                </p>

                                <span class="badge bg-success">${s.estado}</span>
                            </div>
                        </div>
                    `;
            });

            document.getElementById("contenedorServicios").innerHTML = html;
        }

        function filtrarServicios() {
            let filtro = document.getElementById("buscar").value.toLowerCase();
            let tarjetas = document.querySelectorAll(".service-card");

            tarjetas.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(filtro) ? "" : "none";
            });
        }

        function verServicio(servicio) {
            document.getElementById("modalTitulo").innerText = "Detalle del Servicio";
            document.getElementById("modalNombre").innerText = servicio.nombre;
            document.getElementById("modalPrecio").innerText = "$" + servicio.precio.toFixed(2);
            document.getElementById("modalDescripcion").innerText = servicio.descripcion;
            document.getElementById("modalEstado").innerText = servicio.estado;

            new bootstrap.Modal(document.getElementById("modalServicio")).show();
        }
    </script>

</body>
</html>
