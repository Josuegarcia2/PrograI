<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Panel del Administrador - SGCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI",sans-serif;
            background-color: #fdfdfd;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn-outline-success {
            border-color: #198754;
            color: #198754;
        }

            .btn-outline-success:hover {
                background: #198754;
                color: #fff;
            }

        .sidebar {
            position: fixed;
            top: 60px;
            left: -250px;
            width: 250px;
            height: 100%;
            background: #fff;
            color: #198754;
            padding: 20px;
            transition: .3s;
            box-shadow: 3px 0 8px rgba(0,0,0,.1);
        }

            .sidebar.show {
                left: 0;
            }

            .sidebar .close-btn {
                text-align: right;
                font-size: 1.4rem;
                cursor: pointer;
                color: #198754;
                margin-bottom: 20px;
            }

            .sidebar .logo-container {
                text-align: center;
                margin-bottom: 30px;
            }

            .sidebar img {
                max-width: 100px;
            }

            .sidebar h5 {
                color: #198754;
                font-weight: bold;
                margin-top: 10px;
            }

            .sidebar a {
                display: block;
                color: #198754;
                text-decoration: none;
                margin-bottom: 15px;
                transition: .2s;
            }

                .sidebar a:hover {
                    color: #0b5e2c;
                    transform: translateX(3px);
                }

        .main-content {
            margin-top: 100px;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .card-panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
            padding: 40px;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-success me-3" onclick="abrirMenu()"><i class="bi bi-list"></i></button>
            <span id="nombreUsuarioNavbar" class="fw-bold text-success fs-5"></span>
        </div>
        <div class="d-flex align-items-center">
            <div class="dropdown me-3">
                <button class="btn btn-outline-success dropdown-toggle d-flex align-items-center" type="button"
                        id="perfilDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle fs-5 me-2"></i> Perfil
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item" href="#">Ver perfil</a></li>
                    <li><a class="dropdown-item" href="#">Editar información</a></li>
                </ul>
            </div>
            <button id="logoutBtn" class="btn btn-outline-success"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>
    </nav>

    <div class="sidebar" id="menuLateral">
        <div class="close-btn" onclick="cerrarMenu()">✖</div>
        <div class="logo-container">
            <img src="/img/logo de la clinica.png" alt="Logo SGCO">
            <h5>CLÍNICA DENTAL SGCO</h5>
        </div>
        <a href="#"><i class="bi bi-person-badge me-2"></i> Empleados</a>
        <a href="#"><i class="bi bi-tooth me-2"></i> Servicios</a>
        <a href="#"><i class="bi bi-calendar-check me-2"></i> Citas</a>
        <a href="#"><i class="bi bi-people me-2"></i> Pacientes</a>
        <a href="#"><i class="bi bi-bar-chart-line me-2"></i> Reportes</a>
        <a href="#"><i class="bi bi-clipboard-check me-2"></i> Bitácora</a>
    </div>

    <div class="main-content">
        <div class="card-panel">
            <h2 class="text-success">Panel del Administrador</h2>
            <h5 id="bienvenida" class="mb-3 text-success"></h5>
            <p>Administra empleados, servicios, citas y reportes del sistema.</p>
            <img src="/img/logo de la clinica.png" style="max-width:250px;">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function abrirMenu() { document.getElementById("menuLateral").classList.add("show"); }
        function cerrarMenu() { document.getElementById("menuLateral").classList.remove("show"); }
        document.addEventListener("DOMContentLoaded", () => {
            const nombre = localStorage.getItem("nombreUsuario");
            const rol = localStorage.getItem("rolUsuario");
            if (!nombre || rol !== "Administrador") { window.location.href = "/Login.html"; return; }
            document.getElementById("bienvenida").textContent = `¡Bienvenido, ${nombre}!`;
            document.getElementById("nombreUsuarioNavbar").textContent = `${nombre}`;
            document.getElementById("logoutBtn").addEventListener("click", () => { localStorage.clear(); window.location.href = "/Login.html"; });
        });
    </script>
</body>
</html>
