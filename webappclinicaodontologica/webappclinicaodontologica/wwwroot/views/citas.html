<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Citas - SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --azul: #0D5B8C;
            --celeste: #5FD3D4;
            --fondo: #f4fafc;
        }

        body {
            background: var(--fondo);
            font-family: "Segoe UI";
        }

        /* TARJETAS DE ESTADÍSTICAS */
        .stats-box {
            padding: 20px;
            border-radius: 16px;
            background: white;
            text-align: center;
            transition: 0.25s;
            border: 1px solid #e7ebee;
        }

            .stats-box:hover {
                transform: translateY(-4px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
            }

        .stats-number {
            font-size: 34px;
            font-weight: bold;
            color: var(--azul);
        }

        /* TARJETA GENERAL */
        .card-custom {
            border-radius: 18px;
            padding: 25px;
            background: white;
            border: 1px solid #e7ebee;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .05);
        }

        .form-label {
            font-weight: 600;
            color: var(--azul);
        }

        h2, h4 {
            color: var(--azul);
            font-weight: 700;
        }

        /* BOTONES */
        .btn-primary {
            background: var(--azul);
            border-color: var(--azul);
        }

            .btn-primary:hover {
                background: #08496c;
                border-color: #08496c;
            }

        .btn-edit {
            background: var(--azul);
            color: white;
        }

        .btn-cancel {
            background: #d9534f;
            color: white;
        }

        /* TABLA */
        table thead {
            background: var(--azul);
            color: white;
        }

        table tbody tr:hover {
            background: #eef7ff;
        }

        /* MODAL */
        .modal-content {
            border-radius: 16px;
            padding: 25px;
        }
    </style>
</head>

<body class="p-4">

    <div class="container mt-4">

        <!-- DASHBOARD -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stats-box">
                    <div class="stats-number" id="totalCitas">0</div>
                    <p>Total de Citas</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-box">
                    <div class="stats-number" id="citasHoy">0</div>
                    <p>Citas Hoy</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-box">
                    <div class="stats-number" id="citasSemana">0</div>
                    <p>Citas Esta Semana</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-box">
                    <div class="stats-number" id="citasPendientes">0</div>
                    <p>Pendientes</p>
                </div>
            </div>
        </div>

        <!-- FORMULARIO -->
        <div class="card-custom mb-4">

            <h2 class="text-center mb-4">Gestión de Citas</h2>

            <form id="formCita" class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Paciente</label>
                    <select id="paciente" class="form-select" required></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Doctor</label>
                    <select id="doctor" class="form-select" required></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fecha</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Hora</label>
                    <input type="time" id="hora" class="form-control" required>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Motivo</label>
                    <input type="text" id="motivo" class="form-control" required>
                </div>

                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary px-4">Guardar Cita</button>
                </div>
            </form>

        </div>

        <!-- BUSCADOR -->
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="buscar" class="form-control" placeholder="Buscar por paciente...">
            </div>
            <div class="col-md-4">
                <input type="date" id="filtroFecha" class="form-control">
            </div>
        </div>

        <!-- TABLA -->
        <div class="card-custom">

            <h4 class="mb-3">Listado de Citas</h4>

            <table class="table table-striped text-center" id="tablaCitas">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Paciente</th>
                        <th>Doctor</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Motivo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

        </div>

    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <h4 class="mb-3">Editar Cita</h4>

                <input type="hidden" id="editId">

                <label>Fecha:</label>
                <input type="date" id="editFecha" class="form-control mb-2">

                <label>Hora:</label>
                <input type="time" id="editHora" class="form-control mb-2">

                <label>Motivo:</label>
                <input type="text" id="editMotivo" class="form-control mb-2">

                <button class="btn btn-primary mt-3 w-100" onclick="guardarEdicion()">
                    Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AQUI VA EL SCRIPT QUE YA TE ENTREGUÉ -->
    <!-- TODO ESTÁ LISTO Y FUNCIONAL -->
    <script>

    </script>

</body>
</html>
