<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Recepcionista</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #caf0f8, #ade8f4);
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
        }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: auto;
        }

            .panel h2 {
                color: #0077b6;
                margin-bottom: 20px;
            }

        .btn-opcion {
            background-color: #00b4d8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 0;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

            .btn-opcion:hover {
                background-color: #0077b6;
            }
    </style>
</head>
<body>
    <div class="panel text-center">
        <h2>Bienvenida, Recepcionista</h2>
        <p>Selecciona una opción para continuar:</p>
        <button class="btn-opcion"><i class="bi bi-calendar-plus"></i> Registrar cita</button>
        <button class="btn-opcion"><i class="bi bi-calendar-week"></i> Ver agenda</button>
        <button class="btn-opcion"><i class="bi bi-search"></i> Buscar paciente</button>
        <button class="btn-opcion"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
    </div>
</body>
</html>
