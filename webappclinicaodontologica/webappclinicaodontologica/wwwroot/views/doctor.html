<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel del Doctor | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #e6f7f8;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ===================== */
        /*      SIDEBAR          */
        /* ===================== */
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(180deg, #0d6e6e, #0a5456);
            color: white;
            padding: 25px 20px;
            box-shadow: 3px 0 15px rgba(0, 0, 0, 0.15);
            border-radius: 0 20px 20px 0;
        }

            .sidebar h5 {
                text-align: center;
                font-size: 22px;
                margin-bottom: 25px;
                padding-bottom: 10px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            }

            .sidebar a {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 15px;
                color: #ffffffdd;
                margin-bottom: 10px;
                border-radius: 10px;
                font-size: 16px;
                text-decoration: none;
                transition: all .25s ease;
            }

                .sidebar a:hover {
                    background: rgba(255, 255, 255, 0.25);
                    padding-left: 20px;
                }

                .sidebar a i {
                    font-size: 18px;
                }

        /* ===================== */
        /*     TOP – BOTONES     */
        /* ===================== */
        .top-buttons {
            position: absolute;
            right: 40px;
            top: 25px;
            display: flex;
            gap: 12px;
        }

        #nombreUsuarioNavbar {
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 10px;
            border: 2px solid #0d6e6e;
            color: #0d6e6e;
            background: #e6f7f8;
            transition: .25s;
        }

            #nombreUsuarioNavbar:hover {
                background: #0d6e6e;
                color: white;
            }

        .btn-danger {
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ===================== */
        /*  CONTENIDO PRINCIPAL  */
        /* ===================== */
        .contenido {
            margin-left: 280px;
            padding: 40px;
        }

        /* ===================== */
        /*   TARJETA CENTRAL     */
        /* ===================== */
        .panel-card {
            background: white;
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0px 8px 22px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 950px;
            margin: auto;
            animation: fadeIn 0.5s ease-in-out;
        }

            .panel-card h2 {
                font-size: 32px;
                font-weight: 800;
                color: #0d6e6e;
                margin-bottom: 10px;
            }

            .panel-card h4 {
                color: #0a5456;
                margin-bottom: 15px;
            }

            .panel-card p {
                color: #444;
                font-size: 16px;
            }

            .panel-card img {
                width: 160px;
                margin-top: 25px;
                opacity: 0.95;
                transition: .3s ease;
            }

                .panel-card img:hover {
                    transform: scale(1.08);
                }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h5>Panel del Doctor</h5>

        <a href="/views/citas_doctor.html"><i class="bi bi-calendar2-heart"></i> Mis Citas</a>
        <a href="/views/pacientes_doctor.html""><i class="bi bi-person-lines-fill"></i> Pacientes</a>
        <a href="#"><i class="bi bi-journal-medical"></i> Historial Clínico</a>
        <a href="#"><i class="bi bi-capsule-pill"></i> Tratamientos</a>
        <a href="#"><i class="bi bi-clipboard2-pulse"></i> Resultados</a>
    </div>

    <!-- CONTENIDO -->
    <div class="contenido">

        <div class="top-buttons">
            <button id="nombreUsuarioNavbar" class="btn"></button>

            <button onclick="cerrarSesion()" class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </div>

        <div class="panel-card">
            <h2>Panel del Doctor</h2>
            <h4 id="bienvenida"></h4>
            <p>Acceso a herramientas clínicas, citas, historiales y gestión avanzada de pacientes.</p>

            <img src="/img/logo dclinica.png">
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nombre = localStorage.getItem("nombreUsuario");
            if (!nombre) {
                window.location.href = "/views/login.html";
                return;
            }
            document.getElementById("nombreUsuarioNavbar").textContent = `Dr(a). ${nombre}`;
            document.getElementById("bienvenida").textContent = `¡Bienvenido(a), Dr(a). ${nombre}!`;
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/views/login.html";
        }
    </script>

</body>

</html>
