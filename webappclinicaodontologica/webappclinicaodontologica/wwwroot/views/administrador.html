<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Panel del Administrador - SGCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            display: flex;
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e9f2ff, #f8fbff);
        }

        /* Barra lateral */
        .sidebar {
            width: 260px;
            background-color: #0d3b66; /* azul oscuro */
            color: white;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
        }

            .sidebar .logo-container {
                text-align: center;
                margin-bottom: 30px;
            }

            .sidebar img {
                max-width: 120px;
                filter: brightness(2); /* mejora contraste del logo blanco */
            }

            .sidebar h5 {
                font-weight: bold;
                margin-top: 10px;
                color: #cce5ff;
            }

            .sidebar a {
                display: block;
                color: #eaf4ff;
                text-decoration: none;
                margin: 12px 0;
                font-size: 1.05rem;
                transition: all 0.2s ease;
                padding: 10px;
                border-radius: 8px;
            }

                .sidebar a:hover {
                    background-color: #145da0;
                    transform: translateX(4px);
                }

                .sidebar a.text-danger:hover {
                    background-color: #c0392b;
                }

        /* Contenido principal */
        .main-content {
            flex-grow: 1;
            padding: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-panel {
            background-color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

            .card-panel h2 {
                color: #0d3b66;
                font-weight: 700;
                margin-bottom: 15px;
            }

            .card-panel p {
                color: #6c757d;
                font-size: 1.05rem;
                margin-bottom: 25px;
            }

            .card-panel img {
                max-width: 200px;
                margin-bottom: 15px;
                filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.2));
            }

        #bienvenida {
            color: #145da0;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                text-align: center;
                padding: 15px;
            }

            .main-content {
                padding: 20px;
            }

            .sidebar a {
                margin: 5px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Barra lateral -->
    <div class="sidebar">
        <div class="logo-container">
            <img src="/img/logo de la clinica.png" alt="Logo SGCO" />
            <h5>CLÍNICA DENTAL SGCO</h5>
        </div>
        <a href="#"><i class="fas fa-user-shield me-2"></i> Gestión de Usuarios</a>
        <a href="#"><i class="fas fa-database me-2"></i> Configuración del Sistema</a>
        <a href="#"><i class="fas fa-chart-line me-2"></i> Reportes</a>
        <a href="#"><i class="fas fa-tools me-2"></i> Mantenimiento</a>
        <a href="#" id="logoutBtn" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión</a>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="card-panel">
            <h2>Panel del Administrador</h2>
            <h5 id="bienvenida" class="mb-3"></h5>
            <p>Bienvenido al módulo administrativo para gestionar usuarios, configuraciones y reportes del sistema.</p>
            <img src="/img/logo de la clinica.png" alt="Logo de la clínica" />
            <p class="mt-3 text-secondary">Sistema de Gestión Clínica Odontológica</p>
        </div>
    </div>

    <!-- Script de control -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const nombre = localStorage.getItem("nombreUsuario");
            const rol = localStorage.getItem("rolUsuario");

            if (rol !== "Administrador") {
                window.location.href = "/Login.html";
                return;
            }

            if (nombre) {
                document.getElementById("bienvenida").textContent = `¡Bienvenido, ${nombre}!`;
            }

            // Cerrar sesión
            document.getElementById("logoutBtn").addEventListener("click", function () {
                localStorage.clear();
                window.location.href = "/Login.html";
            });
        });
    </script>

</body>
</html>
