<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f2f8fc;
        }

        .card {
            border-radius: 15px;
        }

        .btn-edit {
            background: #0d6efd;
            color: #fff;
        }

        .btn-delete {
            background: #dc3545;
            color: #fff;
        }

        .ver-pass {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 10px;
        }
    </style>
</head>

<body class="p-4">

    <h2 class="text-center mb-4">Gestión de Empleados</h2>

    <div class="container">

        <!-- FORMULARIO -->
        <div class="card p-4 mb-4">
            <h5>Registrar / Editar Empleado</h5>

            <form id="formEmpleado">

                <input type="hidden" id="idEmpleado">

                <div class="row mt-3">
                    <div class="col-md-6">
                        <label>Nombre</label>
                        <input id="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Apellido</label>
                        <input id="apellido" class="form-control" required>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <label>Usuario</label>
                        <input id="usuario" class="form-control" required>
                    </div>

                    <div class="col-md-6 position-relative">
                        <label>Contraseña</label>
                        <input id="contrasena" type="password" class="form-control" required>
                        <i id="togglePass" class="bi bi-eye ver-pass"></i>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <label>Rol</label>
                        <select id="idRol" class="form-select">
                            <option value="1">Recepcionista</option>
                            <option value="2">Doctor</option>
                            <option value="3">Administrador</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Estado</label>
                        <select id="estado" class="form-select">
                            <option>Activo</option>
                            <option>Inactivo</option>
                        </select>
                    </div>
                </div>

                <button class="btn btn-primary mt-3" id="btnRegistro" type="submit">
                    Registrar
                </button>
            </form>
        </div>

        <!-- BUSCADOR -->
        <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar empleado...">

        <!-- TABLA -->
        <div class="card p-3">
            <table class="table table-hover" id="tablaEmpleados">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

    <script>
        const API = "https://localhost:7148/api/Empleado";
        let modoEdicion = false;

        // ========================
        // LISTAR EMPLEADOS
        // ========================
        async function cargar() {
            const res = await fetch(API);
            const data = await res.json();

            const tbody = document.querySelector("tbody");
            tbody.innerHTML = "";

            data.forEach(emp => {
                const rol = emp.idRol == 3 ? "Administrador" :
                    emp.idRol == 2 ? "Doctor" : "Recepcionista";

                tbody.innerHTML += `
                <tr>
                    <td>${emp.idEmpleado}</td>
                    <td>${emp.nombre} ${emp.apellido}</td>
                    <td>${emp.usuario}</td>
                    <td>${rol}</td>
                    <td>${emp.estado}</td>
                    <td>
                        <button class="btn btn-sm btn-edit" onclick="editar(${emp.idEmpleado})">Editar</button>
                        <button class="btn btn-sm btn-delete" onclick="eliminar(${emp.idEmpleado})">Eliminar</button>
                    </td>
                </tr>
            `;
            });
        }
        cargar();

        // ========================
        // EDITAR EMPLEADO
        // ========================
        async function editar(id) {
            const res = await fetch(`${API}/${id}`);
            const emp = await res.json();

            modoEdicion = true;
            document.getElementById("btnRegistro").textContent = "Guardar cambios";

            idEmpleado.value = emp.idEmpleado;
            nombre.value = emp.nombre;
            apellido.value = emp.apellido;
            usuario.value = emp.usuario;
            contrasena.value = emp.contrasena;
            idRol.value = emp.idRol;
            estado.value = emp.estado;
        }

        // ========================
        // ELIMINAR
        // ========================
        async function eliminar(id) {
            if (!confirm("¿Eliminar empleado?")) return;

            await fetch(`${API}/${id}`, { method: "DELETE" });
            cargar();
        }

        // ========================
        // GUARDAR / REGISTRAR
        // ========================
        formEmpleado.addEventListener("submit", async e => {
            e.preventDefault();

            const emp = {
                idEmpleado: idEmpleado.value || 0,
                nombre: nombre.value,
                apellido: apellido.value,
                usuario: usuario.value,
                contrasena: contrasena.value,
                idRol: parseInt(idRol.value),
                estado: estado.value
            };

            let res;

            if (modoEdicion) {
                res = await fetch(`${API}/${emp.idEmpleado}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(emp)
                });
            } else {
                res = await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(emp)
                });
            }

            if (!res.ok) {
                alert("Error: usuario posiblemente duplicado");
                return;
            }

            alert("Guardado correctamente");

            modoEdicion = false;
            btnRegistro.textContent = "Registrar";
            formEmpleado.reset();
            cargar();
        });

        // ========================
        // VER / OCULTAR CONTRASEÑA
        // ========================
        document.getElementById("togglePass").onclick = () => {
            if (contrasena.type === "password") {
                contrasena.type = "text";
                togglePass.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                contrasena.type = "password";
                togglePass.classList.replace("bi-eye-slash", "bi-eye");
            }
        };

        // ========================
        // BUSCADOR
        // ========================
        document.getElementById("buscar").addEventListener("input", () => {
            const filtro = buscar.value.toLowerCase();
            document.querySelectorAll("tbody tr").forEach(tr => {
                tr.style.display = tr.textContent.toLowerCase().includes(filtro)
                    ? ""
                    : "none";
            });
        });
    </script>

</body>
</html>
