<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios - Recepcionista | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        /* TOPBAR */
        .topbar {
            height: 60px;
            background: #fff;
            padding: 15px 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contenido {
            padding: 25px;
        }

        h2 {
            font-weight: 800;
            color: #0D5B8C;
        }

        .card {
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        table thead {
            background: #0D5B8C;
            color: white;
        }

        .btn-regresar {
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <h5 id="userName">Recepcionista</h5>

        <a href="/views/recepcion_panel.html" class="btn btn-outline-primary btn-regresar">
            ← Volver al Panel Principal
        </a>
    </div>

    <!-- CONTENIDO -->
    <div class="contenido">
        <h2 class="mb-3">Servicios Disponibles</h2>

        <div class="card mb-3">
            <input type="text" id="buscar" class="form-control" placeholder="🔍 Buscar servicio..."
                   onkeyup="filtrarTabla()">
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover text-center">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Servicio</th>
                            <th>Precio</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyServicios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = "https://localhost:7148/api/Servicio";

        document.addEventListener("DOMContentLoaded", () => {
            cargarServicios();
            validarSesion();
        });

        /* ===============================
                VALIDAR SESIÓN
        =============================== */
        function validarSesion() {
            const nombre = localStorage.getItem("nombreUsuario");
            const rol = localStorage.getItem("rolUsuario");

            if (!nombre || rol !== "Recepcionista") {
                window.location.href = "/views/login.html";
                return;
            }

            document.getElementById("userName").textContent = nombre;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/views/login.html";
        }

        /* ===============================
                CARGAR SERVICIOS
        =============================== */
        async function cargarServicios() {
            const res = await fetch(API);
            const data = await res.json();

            let tbody = document.getElementById("tbodyServicios");
            tbody.innerHTML = "";

            data.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td>${s.idServicio}</td>
                        <td>${s.nombre}</td>
                        <td>$${s.precio.toFixed(2)}</td>
                        <td>${s.descripcion}</td>
                        <td>${s.estado}</td>
                    </tr>`;
            });
        }

        /* ===============================
                BUSCAR SERVICIO
        =============================== */
        function filtrarTabla() {
            let filtro = document.getElementById("buscar").value.toLowerCase();
            let filas = document.querySelectorAll("#tbodyServicios tr");

            filas.forEach(f => {
                let texto = f.innerText.toLowerCase();
                f.style.display = texto.includes(filtro) ? "" : "none";
            });
        }
    </script>

</body>
</html>
