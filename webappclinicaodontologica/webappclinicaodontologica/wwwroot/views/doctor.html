<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Doctor - SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --verde: #1B8F5A;
            --verde-oscuro: #146c43;
            --fondo: #F3F9F6;
            --texto: #0b3b2e;
            --blanco: #FFFFFF;
        }

        body {
            margin: 0;
            background: var(--fondo);
            font-family: "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        /* TOPBAR */
        .topbar {
            height: 70px;
            background: var(--blanco);
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

            .topbar img {
                height: 48px;
            }

            .topbar .nombre-doctor {
                font-size: 1.35rem;
                font-weight: 700;
                color: var(--verde-oscuro);
            }

        .btn-outline-success {
            border-color: var(--verde);
            color: var(--verde);
        }

            .btn-outline-success:hover {
                background: var(--verde);
                color: white;
            }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            position: fixed;
            top: 70px;
            left: 0;
            bottom: 0;
            background: var(--blanco);
            padding: 30px 20px;
            box-shadow: 3px 0 15px rgba(0,0,0,0.08);
        }

            .sidebar h5 {
                font-weight: bold;
                color: var(--verde-oscuro);
                text-align: center;
                margin-bottom: 25px;
            }

            .sidebar a {
                display: block;
                padding: 14px 20px;
                margin-bottom: 10px;
                text-decoration: none;
                font-size: 1.1rem;
                color: var(--texto);
                border-radius: 10px;
                transition: 0.25s;
            }

                .sidebar a i {
                    margin-right: 12px;
                    font-size: 1.3rem;
                    color: var(--verde);
                }

                .sidebar a:hover {
                    background: var(--verde);
                    color: white;
                    transform: translateX(5px);
                }

        /* CONTENIDO */
        .contenido {
            margin-left: 280px;
            padding: 100px 40px;
        }

        .panel-card {
            background: var(--blanco);
            padding: 45px 35px;
            border-radius: 18px;
            text-align: center;
            max-width: 850px;
            margin: auto;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
            animation: fadeIn 0.8s ease;
        }

            .panel-card h2 {
                font-size: 2rem;
                font-weight: 700;
                color: var(--verde-oscuro);
            }

            .panel-card h4 {
                font-size: 1.35rem;
                margin-top: 10px;
                color: var(--texto);
            }

            .panel-card p {
                color: #3a5f52;
                font-size: 1.1rem;
            }

            .panel-card img {
                margin-top: 20px;
                width: 190px;
            }

        /* Animación */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- NAV SUPERIOR -->
    <div class="topbar">
        <div class="d-flex align-items-center">
            <img src="/img/logo dclinica.png">
            <span class="nombre-doctor ms-3" id="nombreUsuarioNavbar"></span>
        </div>

        <div class="d-flex align-items-center">
            <button class="btn btn-outline-success me-3">
                <i class="bi bi-person-circle me-2"></i> Perfil
            </button>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h5>Panel del Doctor</h5>

        <a href="#"><i class="bi bi-calendar2-heart"></i>Mis Citas</a>
        <a href="#"><i class="bi bi-person-lines-fill"></i>Pacientes</a>
        <a href="#"><i class="bi bi-journal-medical"></i>Historial Clínico</a>
        <a href="#"><i class="bi bi-capsule-pill"></i>Tratamientos</a>
        <a href="#"><i class="bi bi-clipboard2-pulse"></i>Resultados</a>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="contenido">
        <div class="panel-card">
            <h2>Panel del Doctor</h2>
            <h4 id="bienvenida"></h4>
            <p>Acceso a herramientas clínicas, citas, historiales y gestión avanzada de pacientes.</p>

            <img src="/img/logo dclinica.png">
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nombre = localStorage.getItem("nombreUsuario");
            if (!nombre) {
                window.location.href = "/views/login.html";
                return;
            }
            document.getElementById("nombreUsuarioNavbar").textContent = `Dr(a). ${nombre}`;
            document.getElementById("bienvenida").textContent = `¡Bienvenido(a), Dr(a). ${nombre}!`;
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/views/login.html";
        }
    </script>

</body>
</html>
